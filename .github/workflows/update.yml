name: Auto-update agentmail version

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/agentmail-to/agentmail-python/releases/latest --jq .tag_name)
          body=$(gh api repos/agentmail-to/agentmail-python/releases/latest --jq .body)
          current=$(grep 'version = ' flake.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          {
            echo "body<<GHEOF"
            echo "$body"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update flake.nix
        if: steps.check.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.latest }}
          OLD_VERSION: ${{ steps.check.outputs.current }}
        run: |
          prefetch=$(nix shell nixpkgs#nix-prefetch-github -c nix-prefetch-github agentmail-to agentmail-python --rev "$NEW_VERSION")
          new_hash=$(echo "$prefetch" | jq -r .hash)

          old_hash=$(grep 'hash = ' flake.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')

          sed -i "s|version = \"$OLD_VERSION\"|version = \"$NEW_VERSION\"|g" flake.nix
          sed -i "s|$old_hash|$new_hash|g" flake.nix

      - name: Verify build
        if: steps.check.outputs.needs_update == 'true'
        run: nix build

      - name: Commit, tag, and release
        if: steps.check.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.latest }}
          RELEASE_BODY: ${{ steps.check.outputs.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update agentmail to $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push
          git push origin "$NEW_VERSION"
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --notes "$RELEASE_BODY"
